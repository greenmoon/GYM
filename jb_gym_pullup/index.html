<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GYM Pull-up">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/gym-icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>GYM Pull-up Trainer V01 2026.10.14 20:43</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <header class="status-bar">
      <h1 id="app-title">GYM Pull-up Trainer V01 2026.10.14 20:43 <span>· Created by Kevin</span></h1>
      <strong id="formula" class="formula">4 × 4 = 16 MIN</strong>
    </header>

    <section id="phase-panel" class="display-panel phase-panel" aria-label="目前階段倒數">
      <p id="phase-label" class="panel-label">READY</p>
      <output id="phase-time" class="big-time" aria-live="polite">02:00</output>
      <p id="split-label" class="panel-note">N1 WORK 2 MIN</p>
    </section>

    <section class="display-panel total-panel" aria-label="訓練總進度">
      <p class="panel-label">TOTAL LEFT</p>
      <output id="total-time" class="big-time secondary-time" aria-live="polite">16:00</output>
      <p id="cycle-label" class="panel-note">CYCLE 1 / 4</p>
    </section>

    <section class="controls-panel" aria-label="訓練設定">
      <div class="setting" data-setting="n">
        <span>N · CYCLE</span>
        <button type="button" data-adjust="n" data-delta="-1" aria-label="減少每循環分鐘">−</button>
        <output id="n-value">4</output><em>MIN</em>
        <button type="button" data-adjust="n" data-delta="1" aria-label="增加每循環分鐘">＋</button>
      </div>
      <div class="setting" data-setting="n1">
        <span>N1 · WORK</span>
        <button type="button" data-adjust="n1" data-delta="-0.5" aria-label="減少運動時間">−</button>
        <output id="n1-value">2</output><em>MIN</em>
        <button type="button" data-adjust="n1" data-delta="0.5" aria-label="增加運動時間">＋</button>
      </div>
      <div class="setting fixed-setting">
        <span>N2 · REST</span>
        <output id="n2-value">2</output><em>MIN</em>
      </div>
      <div class="setting" data-setting="m">
        <span>M · CYCLES</span>
        <button type="button" data-adjust="m" data-delta="-1" aria-label="減少循環次數">−</button>
        <output id="m-value">4</output><em>×</em>
        <button type="button" data-adjust="m" data-delta="1" aria-label="增加循環次數">＋</button>
      </div>
      <div class="button-row">
        <button id="start-button" class="primary-button" type="button">START</button>
        <button id="reset-button" class="secondary-button" type="button">RESET</button>
      </div>
    </section>

    <div id="done-overlay" class="done-overlay" role="alertdialog" aria-modal="true" aria-labelledby="done-title" hidden>
      <div class="done-card">
        <p>WORKOUT COMPLETE</p>
        <h2 id="done-title">DONE</h2>
        <p id="done-summary">4 cycles · 16 minutes</p>
        <button id="done-reset-button" class="primary-button" type="button">AGAIN</button>
      </div>
    </div>

    <aside class="rotate-notice">請將 iPhone 轉為橫向</aside>
  </main>
  <script src="app.js"></script>
</body>
</html>

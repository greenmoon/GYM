<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GYM Bicycle Heart Rate V04 2026.07.25 15:57</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <header class="status-bar">
      <h1 id="app-title" class="title-line">GYM Bicycle Heart Rate V04 2026.07.25 15:57 <span>· Created by Kevin</span></h1>
      <div class="cycle-badge" aria-live="polite">
        <span>Cycle</span>
        <strong id="cycle-count">1 / 3</strong>
      </div>
    </header>

    <section class="heart-panel" aria-label="Target heart rate">
      <div class="heart-mark" aria-hidden="true">♥</div>
      <div class="rate-wrap">
        <output id="heart-rate" class="heart-rate" aria-live="polite">85</output>
        <span class="unit">BPM</span>
      </div>
      <p id="phase-label" class="phase-label">READY · RAMP UP</p>
    </section>

    <section class="controls-panel">
      <div class="time-block">
        <span class="time-label">Cycle time</span>
        <output id="cycle-time" class="time-value">00:00 / 05:00</output>
      </div>

      <div class="progress-track" aria-label="Cycle progress">
        <div id="progress-fill" class="progress-fill"></div>
        <span class="peak-marker" aria-hidden="true"></span>
      </div>

      <div class="button-row">
        <button id="start-button" class="primary-button" type="button">START</button>
        <button id="reset-button" class="secondary-button" type="button">RESET</button>
      </div>
    </section>

    <div id="done-overlay" class="done-overlay" role="alertdialog" aria-modal="true" aria-labelledby="done-title" hidden>
      <div class="done-card">
        <p class="eyebrow">WORKOUT COMPLETE</p>
        <h2 id="done-title">DONE</h2>
        <p>3 cycles · 15 minutes</p>
        <button id="done-reset-button" class="primary-button" type="button">AGAIN</button>
      </div>
    </div>

    <aside class="rotate-notice" aria-live="polite">
      Rotate iPhone to landscape
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
